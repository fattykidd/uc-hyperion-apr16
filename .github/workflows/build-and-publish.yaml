name: Build and Publish Integration Driver

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- Job 1: Build & Push Multi-Arch Docker Container ---
  build-docker:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Job 2: Build Native .tar.gz Package for Direct Remote Installation ---
  build-tarball:
    name: Build Release for Direct Remote Installation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract release version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v1.0.0-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "PACKAGE_NAME=uc-hyperion-apr16-${VERSION}.tar.gz" >> $GITHUB_OUTPUT

      - name: Assemble Native Integration Package
        run: |
          mkdir -p build_pkg

          # Copy core driver source files & metadata manifests
          cp -r driver driver.json requirements.txt README.md build_pkg/

          # Install pure-python requirements directly into package root
          pip install --target=build_pkg -r requirements.txt --no-compile

          # Create final tarball package
          cd build_pkg
          tar -czvf "../${{ steps.vars.outputs.PACKAGE_NAME }}" .
          cd ..

      - name: Upload Build Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.PACKAGE_NAME }}
          path: ${{ steps.vars.outputs.PACKAGE_NAME }}

      - name: Publish Tarball to GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vars.outputs.PACKAGE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}