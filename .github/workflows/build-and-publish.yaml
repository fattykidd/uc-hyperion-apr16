name: Build and Publish Integration Driver

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- Job 1: Build & Push Multi-Arch Docker Container ---
  build-docker:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Job 2: Build Native .tar.gz Package for Direct Remote Installation ---
  build-tarball:
    name: Build Release for Direct Remote Installation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract release version or commit hash
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="main-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Assemble Native Integration Package
        run: |
          # Create a clean packaging staging directory
          mkdir -p build_pkg

          # Copy driver files, metadata manifest, and entrypoints
          cp -r driver driver.json requirements.txt README.md build_pkg/

          # Bundle dependencies into the package root so the Remote can run offline
          pip install --target=build_pkg -r requirements.txt

          # Create the final .tar.gz archive
          cd build_pkg
          tar -czvf ../uc-hyperion-apr16-${{ steps.vars.outputs.VERSION }}.tar.gz .
          cd ..

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uc-hyperion-apr16-${{ steps.vars.outputs.VERSION }}.tar.gz
          path: uc-hyperion-apr16-${{ steps.vars.outputs.VERSION }}.tar.gz

      - name: Attach Tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: uc-hyperion-apr16-${{ steps.vars.outputs.VERSION }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}